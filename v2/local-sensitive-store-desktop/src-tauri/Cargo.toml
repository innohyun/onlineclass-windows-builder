[package]
name = "local-sensitive-store-desktop"
version = "0.2.57"
default-run = "local-sensitive-store-desktop"
description = "ClassAiMate 교사 데스크 로컬 데이터 저장소"
authors = ["onlineclass"]
edition = "2021"

[lib]
name = "local_sensitive_store_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
url = "2"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = "3"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = "1"
regex = "1"
fs2 = "0.4"
rmcp = { version = "=3.0.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { version = "=3.0.1", features = ["client", "server", "transport-io"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.52"
