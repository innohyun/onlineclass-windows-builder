name: ClassAiMate 교사 데스크 릴리스

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Private onlineClass source commit SHA that was synced into this builder repo."
        required: true
      release_tag:
        description: "GitHub Release tag. Empty uses local-sensitive-store-v{package.version}."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2/local-sensitive-store-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v2/local-sensitive-store-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate synced source commit
        shell: pwsh
        working-directory: .
        env:
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
        run: |
          $source = Get-Content "builder-source.json" -Raw | ConvertFrom-Json
          if ($source.sourceDirty -ne $false) { throw "builder-source.json reports sourceDirty=true." }
          if ($source.sourceCommit -ne $env:SOURCE_COMMIT_INPUT) {
            throw "source_commit mismatch. input=$($env:SOURCE_COMMIT_INPUT) builder-source=$($source.sourceCommit)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Prepare student record MCP sidecar
        run: npm run prepare:student-record-mcp-sidecar

      - name: Build Windows installer
        run: npx tauri build --config src-tauri/tauri.sidecar.conf.json --bundles nsis

      - name: Verify desktop main binary selection
        shell: pwsh
        run: |
          $mainBinary = "src-tauri/target/release/local-sensitive-store-desktop.exe"
          $sidecarBinary = "src-tauri/target/release/classaimate-student-record-mcp.exe"
          if (-not (Test-Path $mainBinary -PathType Leaf)) {
            throw "Tauri did not build the desktop main binary: $mainBinary"
          }
          if (-not (Test-Path $sidecarBinary -PathType Leaf)) {
            throw "Student record MCP sidecar is missing: $sidecarBinary"
          }

      - name: Verify GUI subsystem, MCP stdio, installer shortcut and first launch
        shell: pwsh
        run: |
          function Get-PeSubsystem([string]$Path) {
            $stream = [System.IO.File]::OpenRead((Resolve-Path $Path))
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4 + 20 + 68
              return $reader.ReadUInt16()
            } finally { $stream.Dispose() }
          }
          $mainBinary = (Resolve-Path "src-tauri/target/release/local-sensitive-store-desktop.exe").Path
          $sidecarBinary = (Resolve-Path "src-tauri/target/release/classaimate-student-record-mcp.exe").Path
          if ((Get-PeSubsystem $mainBinary) -ne 2) { throw "Desktop main binary is not WINDOWS_GUI subsystem." }
          if ((Get-PeSubsystem $sidecarBinary) -ne 2) { throw "MCP sidecar is not WINDOWS_GUI subsystem." }
          $mcpInput = Join-Path $env:RUNNER_TEMP "classaimate-mcp-input.jsonl"
          $mcpOutput = Join-Path $env:RUNNER_TEMP "classaimate-mcp-output.jsonl"
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"builder-gate","version":"1"}}}',
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          )
          [System.IO.File]::WriteAllText($mcpInput, (($requests -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          $mcp = Start-Process -FilePath $sidecarBinary -RedirectStandardInput $mcpInput -RedirectStandardOutput $mcpOutput -PassThru -WindowStyle Hidden
          if (-not $mcp.WaitForExit(15000)) { $mcp.Kill(); throw "MCP sidecar stdio handshake timed out." }
          if ($mcp.ExitCode -ne 0) { throw "MCP sidecar exited with $($mcp.ExitCode)." }
          $mcpResult = Get-Content $mcpOutput -Raw
          if ($mcpResult -notmatch '"id"\s*:\s*1' -or $mcpResult -notmatch '"id"\s*:\s*2' -or $mcpResult -notmatch 'student_record_list_scopes') {
            throw "MCP initialize/tools-list handshake response is incomplete."
          }
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found for launch gate." }
          $startedAt = (Get-Date).AddMinutes(-1)
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Silent installer failed with $($installed.ExitCode)." }
          $tauriConfig = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $expectedMainNames = @('local-sensitive-store-desktop.exe', "$($tauriConfig.productName).exe")
          $shortcutRoots = @((Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'), [Environment]::GetFolderPath('Desktop'), (Join-Path $env:PUBLIC 'Desktop'))
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $null
          foreach ($candidate in Get-ChildItem $shortcutRoots -Filter '*.lnk' -Recurse -ErrorAction SilentlyContinue | Where-Object LastWriteTime -ge $startedAt) {
            $resolved = $shell.CreateShortcut($candidate.FullName)
            if ([IO.Path]::GetFileName($resolved.TargetPath) -ieq 'classaimate-student-record-mcp.exe') { throw "Installer shortcut points to MCP sidecar." }
            if ($expectedMainNames -icontains [IO.Path]::GetFileName($resolved.TargetPath)) { $shortcut = [pscustomobject]@{ File = $candidate; Target = $resolved.TargetPath }; break }
          }
          if (-not $shortcut -or -not (Test-Path $shortcut.Target -PathType Leaf)) { throw "Installed desktop shortcut target was not found." }
          Start-Process -FilePath $shortcut.File.FullName
          Start-Sleep -Seconds 6
          $targetPath = [IO.Path]::GetFullPath($shortcut.Target)
          $processRows = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and ([IO.Path]::GetFullPath($_.ExecutablePath) -ieq $targetPath) })
          if ($processRows.Count -ne 1) { throw "First launch expected exactly one desktop process; found $($processRows.Count)." }
          $desktopProcess = Get-Process -Id $processRows[0].ProcessId
          $desktopProcess.Refresh()
          if ($desktopProcess.MainWindowHandle -eq 0) { throw "First launch did not create the desktop main window." }
          Stop-Process -Id $desktopProcess.Id -Force

      - name: Publish installer release and manifest
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_REPO: ${{ github.repository }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $repoRoot = (Resolve-Path .).Path
          $source = Get-Content "builder-source.json" -Raw | ConvertFrom-Json
          $packageJson = Get-Content "v2/local-sensitive-store-desktop/package.json" -Raw | ConvertFrom-Json
          $releaseTag = $env:RELEASE_TAG_INPUT
          if (-not $releaseTag) { $releaseTag = "local-sensitive-store-v$($packageJson.version)" }
          $asset = Get-ChildItem -Path "v2/local-sensitive-store-desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $asset) { throw "NSIS installer not found." }
          $fileName = "OnlineClass-Local-Sensitive-Store-Setup.exe"
          $stagedAsset = Join-Path $env:RUNNER_TEMP $fileName
          Copy-Item $asset.FullName $stagedAsset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $stagedAsset).Hash.ToLowerInvariant()
          $builderCommit = (git -C $repoRoot rev-parse HEAD).Trim()
          $downloadUrl = "https://github.com/$($env:BUILDER_REPO)/releases/download/$releaseTag/$fileName"
          $manifest = [ordered]@{
            name = "ClassAiMate 교사 데스크"
            version = [string]$packageJson.version
            platform = "windows"
            fileName = $fileName
            downloadUrl = $downloadUrl
            status = "available"
            available = $true
            sha256 = $hash
            releasedAt = (Get-Date).ToUniversalTime().ToString("o")
            sourceRepo = [string]$source.sourceRepo
            sourceCommit = [string]$source.sourceCommit
            builderRepo = [string]$env:BUILDER_REPO
            builderCommit = $builderCommit
            releaseTag = $releaseTag
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "local-sensitive-store-latest.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path $manifestPath -Encoding UTF8
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --target $builderCommit --title "ClassAiMate 교사 데스크 $($packageJson.version)" --notes "ClassAiMate 교사 데스크 Windows 설치본입니다. 원본 커밋: $($source.sourceCommit)"
          }
          gh release upload $releaseTag $stagedAsset $manifestPath --clobber
