name: ClassAiMate 교사 데스크 릴리스

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Private onlineClass source commit SHA that was synced into this builder repo."
        required: true
      release_tag:
        description: "GitHub Release tag. Empty uses local-sensitive-store-v{package.version}."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2/local-sensitive-store-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: v2/local-sensitive-store-desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate synced source commit
        shell: pwsh
        working-directory: .
        env:
          SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
        run: |
          $source = Get-Content "builder-source.json" -Raw | ConvertFrom-Json
          if ($source.sourceDirty -ne $false) { throw "builder-source.json reports sourceDirty=true." }
          if ($source.sourceCommit -ne $env:SOURCE_COMMIT_INPUT) {
            throw "source_commit mismatch. input=$($env:SOURCE_COMMIT_INPUT) builder-source=$($source.sourceCommit)"
          }

      - name: Install dependencies
        run: npm ci

      - name: Prepare student record MCP sidecar
        run: npm run prepare:student-record-mcp-sidecar

      - name: Build Windows installer
        run: npx tauri build --config src-tauri/tauri.sidecar.conf.json --bundles nsis

      - name: Verify desktop main binary selection
        shell: pwsh
        run: |
          $mainBinary = "src-tauri/target/release/local-sensitive-store-desktop.exe"
          $sidecarBinary = "src-tauri/target/release/classaimate-student-record-mcp.exe"
          if (-not (Test-Path $mainBinary -PathType Leaf)) {
            throw "Tauri did not build the desktop main binary: $mainBinary"
          }
          if (-not (Test-Path $sidecarBinary -PathType Leaf)) {
            throw "Student record MCP sidecar is missing: $sidecarBinary"
          }

      - name: Verify GUI subsystem, MCP stdio, installer shortcut and first launch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_REPO: ${{ github.repository }}
        run: |
          function Get-PeSubsystem([string]$Path) {
            $stream = [System.IO.File]::OpenRead((Resolve-Path $Path))
            try {
              $reader = [System.IO.BinaryReader]::new($stream)
              $stream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $stream.Position = $peOffset + 4 + 20 + 68
              return $reader.ReadUInt16()
            } finally { $stream.Dispose() }
          }
          $mainBinary = (Resolve-Path "src-tauri/target/release/local-sensitive-store-desktop.exe").Path
          $sidecarBinary = (Resolve-Path "src-tauri/target/release/classaimate-student-record-mcp.exe").Path
          if ((Get-PeSubsystem $mainBinary) -ne 2) { throw "Desktop main binary is not WINDOWS_GUI subsystem." }
          if ((Get-PeSubsystem $sidecarBinary) -ne 2) { throw "MCP sidecar is not WINDOWS_GUI subsystem." }
          $mcpInput = Join-Path $env:RUNNER_TEMP "classaimate-mcp-input.jsonl"
          $mcpOutput = Join-Path $env:RUNNER_TEMP "classaimate-mcp-output.jsonl"
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"builder-gate","version":"1"}}}',
            '{"jsonrpc":"2.0","method":"notifications/initialized","params":{}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
          )
          [System.IO.File]::WriteAllText($mcpInput, (($requests -join "`n") + "`n"), [System.Text.UTF8Encoding]::new($false))
          $mcp = Start-Process -FilePath $sidecarBinary -RedirectStandardInput $mcpInput -RedirectStandardOutput $mcpOutput -PassThru -WindowStyle Hidden
          if (-not $mcp.WaitForExit(15000)) { $mcp.Kill(); throw "MCP sidecar stdio handshake timed out." }
          if ($mcp.ExitCode -ne 0) { throw "MCP sidecar exited with $($mcp.ExitCode)." }
          $mcpResult = Get-Content $mcpOutput -Raw
          if ($mcpResult -notmatch '"id"\s*:\s*1' -or $mcpResult -notmatch '"id"\s*:\s*2' -or $mcpResult -notmatch 'student_record_list_scopes') {
            throw "MCP initialize/tools-list handshake response is incomplete."
          }
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found for launch gate." }
          $previousInstallerDirectory = Join-Path $env:RUNNER_TEMP 'classaimate-previous-installer'
          New-Item -ItemType Directory -Path $previousInstallerDirectory -Force | Out-Null
          gh release download 'local-sensitive-store-v0.2.60' --repo $env:BUILDER_REPO --pattern 'OnlineClass-Local-Sensitive-Store-Setup.exe' --dir $previousInstallerDirectory --clobber
          if ($LASTEXITCODE -ne 0) { throw "Previous installer download failed." }
          $previousInstaller = Join-Path $previousInstallerDirectory 'OnlineClass-Local-Sensitive-Store-Setup.exe'
          $previousInstalled = Start-Process -FilePath $previousInstaller -ArgumentList '/S' -Wait -PassThru
          if ($previousInstalled.ExitCode -ne 0) { throw "Previous silent installer failed with $($previousInstalled.ExitCode)." }
          $tauriConfig = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $shortcutRoots = @((Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'), (Join-Path $env:PROGRAMDATA 'Microsoft\Windows\Start Menu\Programs'), [Environment]::GetFolderPath('Desktop'), (Join-Path $env:PUBLIC 'Desktop'))
          $shell = New-Object -ComObject WScript.Shell
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowGate {
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr hWnd, uint msg, IntPtr wParam, IntPtr lParam);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr hWnd);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
          }
          '@
          function Get-InstalledGuiProcess([string]$TargetPath) {
            $resolvedTarget = [IO.Path]::GetFullPath($TargetPath)
            foreach ($row in Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath }) {
              if ([IO.Path]::GetFullPath($row.ExecutablePath) -ine $resolvedTarget) { continue }
              $process = Get-Process -Id $row.ProcessId -ErrorAction SilentlyContinue
              if ($process) { return $process }
            }
            return $null
          }
          function Wait-InstalledGuiProcess([string]$TargetPath, [int]$ExpectedProcessId = 0) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              $process = Get-InstalledGuiProcess $TargetPath
              if (-not $process) { continue }
              $process.Refresh()
              if ($ExpectedProcessId -and $process.Id -ne $ExpectedProcessId) { throw "Shortcut created a second desktop process. expected=$ExpectedProcessId actual=$($process.Id)" }
              if ($process.MainWindowHandle -ne 0 -and [WindowGate]::IsWindowVisible($process.MainWindowHandle) -and [WindowGate]::GetForegroundWindow() -eq $process.MainWindowHandle) { return $process }
            }
            throw "Installed GUI window did not become foreground for $TargetPath."
          }
          function Close-GuiWindow([System.Diagnostics.Process]$Process) {
            $Process.Refresh()
            if ($Process.MainWindowHandle -eq 0) { throw "Desktop process has no window to close." }
            if (-not [WindowGate]::PostMessage($Process.MainWindowHandle, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)) { throw "WM_CLOSE delivery failed." }
          }
          function Start-GuiShortcut([string]$ShortcutPath, [string]$KnownTarget = '') {
            if ($KnownTarget) {
              Start-Process -FilePath $ShortcutPath
              return [pscustomobject]@{ Process = (Wait-InstalledGuiProcess $KnownTarget); Path = $KnownTarget }
            }
            $beforeProcessIds = @(Get-CimInstance Win32_Process | Select-Object -ExpandProperty ProcessId)
            Start-Process -FilePath $ShortcutPath
            $newWindowProcesses = @()
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Milliseconds 500
              $newWindowProcesses = @()
              foreach ($row in Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and ($beforeProcessIds -notcontains $_.ProcessId) }) {
                if ([IO.Path]::GetFileName($row.ExecutablePath) -ieq 'classaimate-student-record-mcp.exe') { continue }
                $process = Get-Process -Id $row.ProcessId -ErrorAction SilentlyContinue
                if ($process -and $process.MainWindowHandle -ne 0 -and [WindowGate]::IsWindowVisible($process.MainWindowHandle) -and (Get-PeSubsystem $row.ExecutablePath) -eq 2) {
                  $newWindowProcesses += [pscustomobject]@{ Process = $process; Path = $row.ExecutablePath }
                }
              }
              if ($newWindowProcesses.Count -gt 0) { break }
            }
            if ($newWindowProcesses.Count -ne 1) { throw "Product shortcut launch expected exactly one new GUI window process; found $($newWindowProcesses.Count)." }
            return $newWindowProcesses[0]
          }
          function Wait-LocalServiceVersion([string]$ExpectedVersion) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              foreach ($port in 51273..51277) {
                try {
                  $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/v1/health" -TimeoutSec 2
                  if ([string]$health.version -eq $ExpectedVersion) { return }
                } catch {}
              }
              Start-Sleep -Milliseconds 500
            }
            throw "Installed local service did not report version $ExpectedVersion."
          }
          function Resolve-InstalledShortcuts {
            $productShortcut = $null
            $quickObservationShortcut = $null
            $audit = @()
            foreach ($candidate in Get-ChildItem $shortcutRoots -Filter '*.lnk' -Recurse -ErrorAction SilentlyContinue) {
              $resolved = $shell.CreateShortcut($candidate.FullName)
              $audit += "$($candidate.FullName) -> $($resolved.TargetPath) $($resolved.Arguments)"
              if ([IO.Path]::GetFileName($resolved.TargetPath) -ieq 'classaimate-student-record-mcp.exe') { throw "Installer shortcut points to MCP sidecar." }
              if ($candidate.BaseName -ieq $tauriConfig.productName) { $productShortcut = [pscustomobject]@{ File = $candidate; Target = $resolved.TargetPath; Arguments = $resolved.Arguments } }
              if ($candidate.BaseName -ieq 'ClassAiMate 빠른 관찰기록') { $quickObservationShortcut = [pscustomobject]@{ File = $candidate; Target = $resolved.TargetPath; Arguments = $resolved.Arguments } }
            }
            return [pscustomobject]@{ Product = $productShortcut; QuickObservation = $quickObservationShortcut; Audit = $audit }
          }
          function Wait-QuickObservationActivation([string]$LogPath) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if (Test-Path $LogPath -PathType Leaf) {
                $acknowledgements = @(Select-String -Path $LogPath -Pattern 'source=frontend-quick-observation attempt=1 ok$')
                if ($acknowledgements.Count -gt 0) { return }
              }
              Start-Sleep -Milliseconds 500
            }
            throw "Quick observation shortcut did not activate the quick observation view."
          }
          $resolvedShortcuts = Resolve-InstalledShortcuts
          $shortcut = $resolvedShortcuts.Product
          $quickShortcut = $resolvedShortcuts.QuickObservation
          $shortcutAudit = $resolvedShortcuts.Audit
          if (-not $shortcut) { throw "Installed product shortcut was not found. Candidates: $($shortcutAudit -join '; ')" }
          if (-not $quickShortcut) { throw "Installed quick observation shortcut was not found. Candidates: $($shortcutAudit -join '; ')" }
          if ($shortcut.Target) {
            if (-not (Test-Path $shortcut.Target -PathType Leaf)) { throw "Installed product shortcut target does not exist: $($shortcut.Target)" }
            if ((Get-PeSubsystem $shortcut.Target) -ne 2) { throw "Installed product shortcut target is not WINDOWS_GUI subsystem." }
          }
          $preferencesDir = Join-Path $env:APPDATA 'OnlineClass\local-sensitive-store'
          New-Item -ItemType Directory -Path $preferencesDir -Force | Out-Null
          $preferencesPath = Join-Path $preferencesDir 'desktop-preferences.json'
          $activationLog = Join-Path $preferencesDir 'desktop-activation.log'
          @{ startWithWindows = $false; keepRunningOnClose = $true } | ConvertTo-Json | Set-Content -Path $preferencesPath -Encoding UTF8
          $previousLaunch = Start-GuiShortcut $shortcut.File.FullName $shortcut.Target
          $previousProcess = $previousLaunch.Process
          $installedTarget = $previousLaunch.Path
          Wait-LocalServiceVersion '2026-08-30.3-quick-shortcut-target'
          $previousProcessId = $previousProcess.Id
          Close-GuiWindow $previousProcess
          Start-Sleep -Milliseconds 700
          if (-not (Get-Process -Id $previousProcessId -ErrorAction SilentlyContinue)) { throw "Previous helper did not remain hidden before upgrade." }
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Upgrade installer failed with $($installed.ExitCode)." }
          for ($attempt = 0; $attempt -lt 20 -and (Get-Process -Id $previousProcessId -ErrorAction SilentlyContinue); $attempt++) { Start-Sleep -Milliseconds 250 }
          if (Get-Process -Id $previousProcessId -ErrorAction SilentlyContinue) { throw "Upgrade installer left the previous background helper running." }
          Remove-Item -Path $activationLog -Force -ErrorAction SilentlyContinue
          $resolvedShortcuts = Resolve-InstalledShortcuts
          $shortcut = $resolvedShortcuts.Product
          $quickShortcut = $resolvedShortcuts.QuickObservation
          $shortcutAudit = $resolvedShortcuts.Audit
          if (-not $shortcut) { throw "Upgraded product shortcut was not found. Candidates: $($shortcutAudit -join '; ')" }
          if (-not $quickShortcut) { throw "Upgraded quick observation shortcut was not found. Candidates: $($shortcutAudit -join '; ')" }
          if ($shortcut.Target -and -not (Test-Path $shortcut.Target -PathType Leaf)) { throw "Upgraded product shortcut target does not exist: $($shortcut.Target)" }
          if ($quickShortcut.Target) {
            if (-not (Test-Path $quickShortcut.Target -PathType Leaf)) { throw "Installed quick observation shortcut target does not exist: $($quickShortcut.Target)" }
            if ((Get-PeSubsystem $quickShortcut.Target) -ne 2) { throw "Installed quick observation shortcut target is not WINDOWS_GUI subsystem." }
          }
          if ($shortcut.Target -and $quickShortcut.Target -and ([IO.Path]::GetFullPath($quickShortcut.Target) -ine [IO.Path]::GetFullPath($shortcut.Target))) { throw "Quick observation shortcut does not target the desktop GUI executable." }
          if ($quickShortcut.Target -and [string]$quickShortcut.Arguments -ne '--quick-observation') { throw "Quick observation shortcut arguments are invalid: $($quickShortcut.Arguments)" }
          $currentLaunch = Start-GuiShortcut $shortcut.File.FullName $shortcut.Target
          $desktopProcess = $currentLaunch.Process
          $installedTarget = $currentLaunch.Path
          Wait-LocalServiceVersion '2026-08-31.1-document-block-transform'
          if ($quickShortcut.Target -and ([IO.Path]::GetFullPath($quickShortcut.Target) -ine [IO.Path]::GetFullPath($installedTarget))) { throw "Quick observation shortcut resolves to an unexpected GUI executable." }
          $backgroundProcessId = $desktopProcess.Id
          for ($cycle = 1; $cycle -le 10; $cycle++) {
            Close-GuiWindow $desktopProcess
            Start-Sleep -Milliseconds 700
            if (-not (Get-Process -Id $backgroundProcessId -ErrorAction SilentlyContinue)) { throw "Background ON close exited during cycle $cycle." }
            Start-Process -FilePath $shortcut.File.FullName
            $desktopProcess = Wait-InstalledGuiProcess $installedTarget $backgroundProcessId
          }
          Close-GuiWindow $desktopProcess
          Start-Sleep -Milliseconds 700
          Start-Process -FilePath $quickShortcut.File.FullName
          $desktopProcess = Wait-InstalledGuiProcess $installedTarget $backgroundProcessId
          Wait-QuickObservationActivation $activationLog
          if (-not (Test-Path $activationLog -PathType Leaf)) { throw "Desktop activation log was not created." }
          if (Select-String -Path $activationLog -Pattern ' error=' -Quiet) { throw "Activation log contains an error." }
          $successfulActivations = @(Select-String -Path $activationLog -Pattern 'source=single-instance attempt=1 ok$')
          if ($successfulActivations.Count -lt 11) { throw "Activation log did not record all successful shortcut reopen events. count=$($successfulActivations.Count)" }
          Stop-Process -Id $backgroundProcessId -Force
          Wait-Process -Id $backgroundProcessId -ErrorAction SilentlyContinue
          @{ startWithWindows = $false; keepRunningOnClose = $false } | ConvertTo-Json | Set-Content -Path $preferencesPath -Encoding UTF8
          Start-Process -FilePath $shortcut.File.FullName
          $desktopProcess = Wait-InstalledGuiProcess $installedTarget
          $foregroundProcessId = $desktopProcess.Id
          Close-GuiWindow $desktopProcess
          for ($attempt = 0; $attempt -lt 20 -and (Get-Process -Id $foregroundProcessId -ErrorAction SilentlyContinue); $attempt++) { Start-Sleep -Milliseconds 500 }
          if (Get-Process -Id $foregroundProcessId -ErrorAction SilentlyContinue) { throw "Background OFF close did not exit the process." }
          Start-Process -FilePath $shortcut.File.FullName
          $reopenedProcess = Wait-InstalledGuiProcess $installedTarget
          if ($reopenedProcess.Id -eq $foregroundProcessId) { throw "Background OFF relaunch did not create a new process." }
          Stop-Process -Id $reopenedProcess.Id -Force

      - name: Publish installer release and manifest
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          BUILDER_REPO: ${{ github.repository }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          $repoRoot = (Resolve-Path .).Path
          $source = Get-Content "builder-source.json" -Raw | ConvertFrom-Json
          $packageJson = Get-Content "v2/local-sensitive-store-desktop/package.json" -Raw | ConvertFrom-Json
          $releaseTag = $env:RELEASE_TAG_INPUT
          if (-not $releaseTag) { $releaseTag = "local-sensitive-store-v$($packageJson.version)" }
          $asset = Get-ChildItem -Path "v2/local-sensitive-store-desktop/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $asset) { throw "NSIS installer not found." }
          $fileName = "OnlineClass-Local-Sensitive-Store-Setup.exe"
          $stagedAsset = Join-Path $env:RUNNER_TEMP $fileName
          Copy-Item $asset.FullName $stagedAsset -Force
          $hash = (Get-FileHash -Algorithm SHA256 $stagedAsset).Hash.ToLowerInvariant()
          $builderCommit = (git -C $repoRoot rev-parse HEAD).Trim()
          $downloadUrl = "https://github.com/$($env:BUILDER_REPO)/releases/download/$releaseTag/$fileName"
          $manifest = [ordered]@{
            name = "ClassAiMate 교사 데스크"
            version = [string]$packageJson.version
            platform = "windows"
            fileName = $fileName
            downloadUrl = $downloadUrl
            status = "available"
            available = $true
            sha256 = $hash
            releasedAt = (Get-Date).ToUniversalTime().ToString("o")
            sourceRepo = [string]$source.sourceRepo
            sourceCommit = [string]$source.sourceCommit
            builderRepo = [string]$env:BUILDER_REPO
            builderCommit = $builderCommit
            releaseTag = $releaseTag
          }
          $manifestPath = Join-Path $env:RUNNER_TEMP "local-sensitive-store-latest.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Path $manifestPath -Encoding UTF8
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $releaseTag --target $builderCommit --title "ClassAiMate 교사 데스크 $($packageJson.version)" --notes "ClassAiMate 교사 데스크 Windows 설치본입니다. 원본 커밋: $($source.sourceCommit)"
          }
          gh release upload $releaseTag $stagedAsset $manifestPath --clobber
